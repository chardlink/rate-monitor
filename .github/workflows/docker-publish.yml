name: 自动构建并发布 Docker 镜像

on:
  push:
    branches:
      - main  # 当代码推送到 main 分支时触发自动构建

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 拉取本地代码
        uses: actions/checkout@v4

      - name: 确定推送目标镜像名称
        id: image_names
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          NAMES="ghcr.io/${{ github.repository }}"
          if [ "${DOCKERHUB_USERNAME}" != "" ]; then
            NAMES="${NAMES},${DOCKERHUB_USERNAME}/rate-monitor"
          fi
          echo "names=${NAMES}" >> $GITHUB_OUTPUT

      - name: 登录到 GitHub 容器镜像仓库 (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录到 Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 提取 Docker 镜像元数据 (标签等)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image_names.outputs.names }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
